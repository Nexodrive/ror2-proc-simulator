<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk of Rain 2 Proc Engine</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, sans-serif;
            padding: 40px;
            text-align: center;
        }
        .box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 { color: #ff9900; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <h1>Risk of Rain 2 Proc Chain Tool</h1>
    <p>Your web project workspace is successfully initialized.</p>

    <div class="box">
        <h3>Test the Core JavaScript Connection</h3>
        <button id="testBtn">Run Quick 10k Simulation</button>
        <p id="output" style="margin-top: 20px; font-weight: bold;"></p>
    </div>

    <script>
        // A minimal placeholder script to test your browser engine environment
        document.getElementById('testBtn').addEventListener('click', () => {
            let totalProcs = 0;
            const simCount = 10000;
            const baseChance = 0.10; // 10% AtG Chance

            for(let i = 0; i < simCount; i++) {
                if(Math.random() < baseChance) {
                    totalProcs++;
                }
            }

            const avgResult = (totalProcs / simCount) * 100;
            document.getElementById('output').innerText = 
                `Success! Fired ${totalProcs.toLocaleString()} procs. Average rate: ${avgResult.toFixed(2)}%`;
        });
    </script>
</body>
</html>
